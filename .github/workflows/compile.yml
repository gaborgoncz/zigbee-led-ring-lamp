name: Compile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    # arduino/compile-sketches@v1 installs a Python that ubuntu-latest (26.04) does not offer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile firmware for XIAO ESP32-C6 (Zigbee router)
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:XIAO_ESP32C6:PartitionScheme=zigbee_zczr,ZigbeeMode=zczr
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.11
          libraries: |
            - name: Adafruit NeoPixel
          sketch-paths: |
            - xiao_c6_lamp
